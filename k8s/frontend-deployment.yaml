spec:
  containers:
    - name: frontend
      image: ruales1138/gigashow-frontend:latest
      imagePullPolicy: Always
      ports:
        - containerPort: 80 # Ajustar si la imagen usa el puerto 80 (Nginx) o 3000
      env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://localhost:30001"