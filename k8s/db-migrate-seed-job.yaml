apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-migrate-seed
  namespace: pequennas-fiestas
  labels:
    app: prisma-migrate-seed
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: prisma-migrate-seed
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate-and-seed
          image: ruales1138/gigashow-backend:1.0.0
          imagePullPolicy: Always
          command: ["sh", "-c", "npx prisma migrate deploy && npm run seed"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
