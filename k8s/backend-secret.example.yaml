# Plantilla declarativa de Secret para Kubernetes.
# Copiar a k8s/backend-secret.yaml (ignorado por Git) o crear vía kubectl create secret.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: pequennas-fiestas
type: Opaque
stringData:
  POSTGRES_DB: "gigashow"
  POSTGRES_USER: "gigashow"
  POSTGRES_PASSWORD: "CAMBIAR_PASSWORD_SEGURO"
  DATABASE_URL: "postgresql://gigashow:CAMBIAR_PASSWORD_SEGURO@postgres-service:5432/gigashow?schema=public"
  JWT_SECRET: "CAMBIAR_JWT_SECRET_LARGO_Y_ALEATORIO"
  BETTER_AUTH_SECRET: "CAMBIAR_AUTH_SECRET_LARGO_Y_ALEATORIO"
