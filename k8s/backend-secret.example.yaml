# Plantilla declarativa de Secret para Kubernetes.
# Nunca subas valores reales a Git; créalo mediante `kubectl create secret` o copia a k8s/backend-secret.yaml (ignorado por .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: pequennas-fiestas
type: Opaque
stringData:
  POSTGRES_DB: "gigashow"
  POSTGRES_USER: "gigashow"
  POSTGRES_PASSWORD: "CAMBIAR_PASSWORD_SEGURO"
  DATABASE_URL: "postgresql://gigashow:CAMBIAR_PASSWORD_SEGURO@postgres-service:5432/gigashow"
  BETTER_AUTH_SECRET: "CAMBIAR_SECRET_DE_AUTENTICACION"
