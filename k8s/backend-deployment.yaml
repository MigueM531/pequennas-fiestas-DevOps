spec:
  containers:
    - name: backend
      image: ruales1138/gigashow-backend:latest
      imagePullPolicy: Always
      ports:
        - containerPort: 3000
      envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
      livenessProbe:
        httpGet:
          path: /health
          port: 3000
        initialDelaySeconds: 15
        periodSeconds: 15
      readinessProbe:
        httpGet:
          path: /health/db
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 10