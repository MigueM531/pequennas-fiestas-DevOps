services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gigashow
      POSTGRES_USER: gigashow
      POSTGRES_PASSWORD: gigashow_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigashow -d gigashow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://gigashow:gigashow_dev_password@database:5432/gigashow?schema=public
      JWT_SECRET: compose-dev-jwt-secret-change-in-prod
      JWT_EXPIRES_IN: 24h
      BETTER_AUTH_SECRET: compose-dev-auth-secret-change-in-prod
      PORT: "3000"
      FRONTEND_ORIGIN: http://localhost:3001
      BACKEND_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run seed && npm start"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
