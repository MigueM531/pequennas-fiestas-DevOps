services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gigashow
      POSTGRES_USER: gigashow
      POSTGRES_PASSWORD: gigashow_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigashow -d gigashow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ruales1138/gigashow-backend:latest
    environment:
      DATABASE_URL: postgresql://gigashow:gigashow_dev_password@database:5432/gigashow?schema=public
      JWT_SECRET: compose-dev-jwt-secret-change-in-prod
      JWT_EXPIRES_IN: 24h
      PORT: "3000"
      FRONTEND_ORIGIN: http://localhost:3001
      BACKEND_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: ruales1138/gigashow-frontend:latest
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:80" # o 3000 según exponga el contenedor de Nginx de Ruales
    depends_on:
      - backend

volumes:
  postgres_data: